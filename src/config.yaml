site:
  name: Martin Green
  site: 'https://martin.nuagegreen.eu'
  base: '/'
  trailingSlash: false

metadata:
  title:
    default: Martin Green — Maillon digital ↔ réel
    template: '%s — Martin Green'
  description: "Chef de projet ingénierie chez Enedis, bricoleur d'IA et de machines 3D. Au croisement du digital et du réel."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Martin Green
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website

i18n:
  language: fr
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/articles/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'articles'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
